[package]
name        = "rust_pii_transformer"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
description = "Deterministic Korean PII detection and masking with guaranteed source-offset recovery. Pure Rust, no models."
repository  = "https://github.com/arabangoo/rust_pii_transformer"
readme      = "README.md"
keywords    = ["pii", "korean", "masking", "privacy", "redaction"]
categories  = ["text-processing"]
# 기본 빌드가 실제로 요구하는 최소 버전(thiserror 2 의 1.71 이 상한).
# feature = "python" 은 PyO3 0.29 때문에 1.83 이상이 필요하다. 옵트인 경로 하나 때문에
# 코어 소비자 전체를 1.83 으로 올리지 않는다.
rust-version = "1.71"

# ── 독립성 원칙(README 3절·16절) ─────────────────────────────────
# 기본 빌드 = pure Rust / zero FFI / zero subprocess / zero network.
# 모델 파일도 없다. 탐지는 규칙과 체크섬으로만 한다.

[lib]
name = "rust_pii_transformer"
# rlib: 일반 Rust 소비자·테스트용, cdylib: 향후 PyO3 확장 모듈용
crate-type = ["rlib", "cdylib"]

[features]
# 코어(오프셋 매핑·정규화·탐지·마스킹)는 항상 빌드된다.
default = []

# Python 바인딩(PyO3 cdylib). abi3 휠 — `maturin develop --features python`.
# serde_json 은 판정 결과를 Python 으로 내보내는 to_json 에만 쓰이므로 함께 옵트인이다.
python = ["dep:pyo3", "dep:serde_json"]

# 해시 가명화 마스킹 정책(Policy::Hash). 검증된 구현을 쓰기 위해 RustCrypto 를 끌어온다.
# 순수 Rust 라 FFI 는 여전히 0 이지만, 기본 빌드의 의존성 2개 약속을 지키려고 옵트인으로 둔다.
hash = ["dep:sha2", "dep:hmac"]

# 명령줄 도구 rpit. 라이브러리 소비자에게 clap 이 새지 않도록 옵트인이다.
cli = ["dep:clap", "dep:serde_json"]

[dependencies]
thiserror = "2"
serde     = { version = "1", features = ["derive"] }

# ── 해시 가명화 (feature = "hash") ──────────────────────────────
sha2 = { version = "0.10", optional = true, default-features = false }
hmac = { version = "0.12", optional = true, default-features = false }

# ── 명령줄 도구 (feature = "cli") ───────────────────────────────
clap = { version = "4", optional = true, features = ["derive"] }

# ── Python 바인딩 (feature = "python") ──────────────────────────
# abi3(안정 이진 인터페이스) 휠이라 Python 3.9 이상에서 휠 하나로 돈다.
pyo3 = { version = "0.29", optional = true, features = ["extension-module", "abi3-py39"] }

# ── 직렬화 출력 (feature = "cli" 또는 "python") ─────────────────
# 판정 결과를 JSON 으로 내보내는 경로에만 쓰인다.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# 직렬화 이름이 API 가 보고하는 이름과 같은지 검사하는 데 쓴다.
# 개발 의존성이라 소비자의 의존성 그래프에는 들어가지 않는다.
serde_json = "1"

# 테이블을 가르지 않도록 [[bin]] 은 파일 맨 끝에 둔다.
# 의존성 사이에 끼우면 뒤쪽 항목이 [dependencies] 밖으로 밀려난다.
[[bin]]
name              = "rpit"
path              = "src/bin/rpit.rs"
required-features = ["cli"]
